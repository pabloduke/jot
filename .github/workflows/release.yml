name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/paws-in-the-machine/jot/internal/jot.version=${VERSION}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="jot_${VERSION}_${os}_${arch}"
            echo "building ${name}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -buildvcs=false -ldflags "$ldflags" -o "dist/${name}/jot" ./cmd/jot
            cp LICENSE README.md "dist/${name}/"
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            rm -rf "dist/${name}"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz dist/checksums.txt \
            --title "${{ github.ref_name }}" --generate-notes
